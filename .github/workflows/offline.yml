name: Source-only offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.3 exchange-calendars==4.13.2 python-dotenv==1.2.4 requests==2.34.2 beautifulsoup4==4.15.0
      - run: python scripts/repo_security.py
      - run: python scripts/run_offline_tests.py
